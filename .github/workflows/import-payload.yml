name: Importar fuentes v0.1.0
on:
  push:
    paths:
      - source_payload.b64
permissions:
  contents: write
jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar y extraer archivos fuente
        run: |
          python - <<'PY'
          import base64, io, shutil, zipfile
          from pathlib import Path
          raiz = Path.cwd()
          payload = raiz / 'source_payload.b64'
          data = base64.b64decode(payload.read_text(encoding='ascii'), validate=True)
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              prefijo = 'Cargador_Trazabilidad_Local/'
              assert z.namelist() and all(n.startswith(prefijo) for n in z.namelist())
              for info in z.infolist():
                  if info.is_dir():
                      continue
                  relative = Path(info.filename[len(prefijo):])
                  assert relative.parts and not any(p in ('.','..') for p in relative.parts)
                  destino = raiz / relative
                  destino.parent.mkdir(parents=True,exist_ok=True)
                  with z.open(info) as origen,destino.open('wb') as archivo:
                      shutil.copyfileobj(origen,archivo)
          for nombre in ('source_payload.b64','payload-01.part','.github/workflows/import-payload.yml'):
              (raiz / nombre).unlink(missing_ok=True)
          PY
      - name: Guardar archivos de aplicación
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publicar código completo del cargador v0.1.0"
          git push origin HEAD:main
